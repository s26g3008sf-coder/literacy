<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テーブルサンプル</title>
  <style>
    table {
      width: 60%;
      border-collapse: collapse;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }

    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>名前</th>
        <th>年齢</th>
        <th>夢</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>植平</td>
        <td>19</td>
        <td>学生</td>
      </tr>
      <tr>
        <td>石川</td>
        <td>2</td>
        <td>パティシエ</td>
      </tr>
      <tr>
        <td>田中</td>
        <td>56</td>
        <td>仮面ライダー</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
